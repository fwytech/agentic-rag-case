[project]
name = "agentic-rag-smart-qa"
version = "2.0.0"
description = "Agentic RAG智能问答系统 - 生产级Web应用，支持双模式LLM（Ollama本地 + 在线API）"
authors = [
    {name = "fwytech", email = "fwytech@126.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["agentic-rag", "qa-system", "streamlit", "ollama", "langchain", "faiss"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: Streamlit",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    # Web 框架
    "streamlit==1.28.1",

    # AI 框架
    "langchain==0.0.335",
    "langchain-community==0.3.27",
    "langchain-core==0.1.1",

    # 向量数据库
    "faiss-cpu==1.7.4",

    # LLM 客户端 (支持 Ollama 本地模型和在线 API)
    "ollama==0.1.7",
    "openai>=1.0.0",  # 兼容阿里云百炼和 OpenAI API

    # 文档处理
    "pypdf==3.17.0",
    "python-docx==1.1.0",

    # HTTP 请求
    "requests==2.31.0",
    "urllib3==2.1.0",

    # 数据处理
    "numpy==1.24.3",
    "pandas==2.1.3",

    # 可视化
    "plotly==5.18.0",

    # 机器学习
    "scikit-learn==1.3.2",
    "sentence-transformers==2.2.2",
    "torch==2.1.1",
    "transformers==4.35.2",

    # 其他工具
    "python-dotenv",  # 环境变量管理
    "json5",
    "markdown",
]

[project.optional-dependencies]
# 开发依赖
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
# 文档生成
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0",
]
# 监控和性能分析
monitoring = [
    "loguru>=0.7.0",
    "tiktoken>=0.5.0",
]

[project.scripts]
agentic-rag-qa = "app:main"

[project.urls]
Homepage = "https://github.com/fwytech/agentic-rag-case"
Repository = "https://github.com/fwytech/agentic-rag-case/tree/main/agentic_rag_smart_qa_project"
Issues = "https://github.com/fwytech/agentic-rag-case/issues"
Documentation = "https://github.com/fwytech/agentic-rag-case/blob/main/agentic_rag_smart_qa_project/README.md"
Tutorial = "https://github.com/fwytech/agentic-rag-case/blob/main/agentic_rag_smart_qa_project/TUTORIAL.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pytest>=7.4.0",
]

[tool.hatchling.build.targets.wheel]
packages = ["config", "models", "services", "utils"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | \.tox
  | build
  | dist
  | __pycache__
  | data
  | vector_store
  | chat_history
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=. --cov-report=term-missing"

[tool.streamlit]
# Streamlit 配置
[tool.streamlit.server]
port = 8501
enableCORS = false

[tool.streamlit.browser]
gatherUsageStats = false
